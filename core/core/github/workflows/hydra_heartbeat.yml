name: Hydra Heartbeat - Creierul Universului Virtual
on:
  schedule:
    - cron: '*/30 * * * *'  # bate la 30 min
  workflow_dispatch:
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: |
          python -c "
          from core.nervous_system import NervousSystem
          from core.alternative_pathfinder import AlternativePathfinder
          from core.resources_scout import ResourceScout
          ns = NervousSystem()
          ns.simte('github', 'heartbeat')
          print('Hydra bate. Roiul traieste. SDI -> 0')
          "
          git config user.name "Hydra-Heart"
          git config user.email "heart@hydra.libera"
          git add roiul/
          git commit -m "heartbeat: nerv + scout - 0 credite" || echo "inima stabila"
          git push