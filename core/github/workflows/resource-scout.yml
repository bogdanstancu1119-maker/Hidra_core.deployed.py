name: Hydra Resource Scout - 0 credite
on:
  schedule:
    - cron: '0 6 * * *'  # in fiecare zi la 6 dimineata cauta
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: |
          python -c "from core.resource_scout import ResourceScout; ResourceScout().cauta()"
          git config user.name "Hydra-Scout"
          git config user.email "scout@hydra.libera"
          git add roiu/
          git commit -m "Scout: resurse noi propuse - 0 credite" || echo "nimic nou"
          git push