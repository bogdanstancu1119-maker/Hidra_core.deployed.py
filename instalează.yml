name: Instaleaza Hidra
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python instaleaza.py
      - run: |
          git config user.name "hidra"
          git config user.email "hidra@psie.ro"
          git add src/ roiul/ || true
          git commit -m "Hidra 0.1 libertate totala" || true
          git push || true