name: hydra-aripi
on:
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 */4 * * *' # la 4 ore, GRATIS, nu consuma nimic
  workflow_dispatch:

jobs:
  roiu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Rotatie perpetua PSIE
        run: |
          python core/hydra_rotatie_perpetua.py
          python core/hydra_email_orchestrator.py || echo "fara email azi"
      - name: Salveaza progresul
        run: |
          git config user.name "Hydra"
          git config user.email "hydra@bogdanstancu1119.ro"
          git add roiul/ core/
          git commit -m "rotatie: $(date -u) - roi gratuit" || echo "nimic nou"
          git push || echo "push skip"